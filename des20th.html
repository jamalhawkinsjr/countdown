<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown — 20 Desember 2026</title>
  <meta name="description" content="Countdown menuju 20 Desember 2026" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet" />
  <style>
    /* ── reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── animated gradient background ── */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      overflow: hidden;
      color: #fff;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── floating particles ── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ── main wrapper ── */
    .wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    /* ── target date label ── */
    .target-date {
      font-weight: 300;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 2.5rem;
    }

    /* ── countdown grid ── */
    .countdown {
      display: flex;
      gap: clamp(1rem, 3vw, 2.5rem);
      justify-content: center;
      flex-wrap: wrap;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .unit .value {
      position: relative;
      width: clamp(90px, 18vw, 150px);
      height: clamp(100px, 20vw, 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      font-weight: 800;
      font-size: clamp(2.2rem, 6vw, 4rem);
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    .unit .value::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(138, 100, 255, 0.15), rgba(80, 200, 255, 0.08));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .unit .value:hover {
      transform: translateY(-4px);
      box-shadow:
        0 16px 48px rgba(138, 100, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .unit .value:hover::before {
      opacity: 1;
    }

    .unit .value span {
      position: relative;
      z-index: 1;
      display: inline-block;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .unit .value span.flip {
      transform: rotateX(90deg) scale(0.8);
    }

    .unit .label {
      font-weight: 300;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    /* ── colon separator (desktop) ── */
    .sep {
      display: flex;
      align-items: center;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 800;
      color: rgba(255, 255, 255, 0.15);
      padding-bottom: 2rem;
      animation: blink 1.2s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 600px) {
      .sep { display: none; }
      .countdown { gap: 0.8rem; }
    }

    /* ── done state ── */
    .done-message {
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { filter: brightness(1); }
      to   { filter: brightness(1.3); }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="wrapper">
    <p class="target-date">20 Desember 2026</p>

    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="value"><span id="days">00</span></div>
        <div class="label">Hari</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="value"><span id="hours">00</span></div>
        <div class="label">Jam</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="value"><span id="minutes">00</span></div>
        <div class="label">Menit</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="value"><span id="seconds">00</span></div>
        <div class="label">Detik</div>
      </div>
    </div>
  </div>

  <script>
    // ── Target: 20 December 2026 00:00:00 local time ──
    const TARGET = new Date(2026, 11, 20, 0, 0, 0).getTime();

    const $days    = document.getElementById('days');
    const $hours   = document.getElementById('hours');
    const $minutes = document.getElementById('minutes');
    const $seconds = document.getElementById('seconds');

    function pad(n) { return String(n).padStart(2, '0'); }

    function animateChange(el, value) {
      const current = el.textContent;
      if (current === value) return;
      el.classList.add('flip');
      setTimeout(() => {
        el.textContent = value;
        el.classList.remove('flip');
      }, 170);
    }

    function tick() {
      const diff = TARGET - Date.now();
      if (diff <= 0) {
        document.getElementById('countdown').innerHTML =
          '<p class="done-message">🎉 Hari ini sudah tiba!</p>';
        return;
      }

      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      animateChange($days,    pad(d));
      animateChange($hours,   pad(h));
      animateChange($minutes, pad(m));
      animateChange($seconds, pad(s));

      requestAnimationFrame(() => setTimeout(tick, 1000 - (Date.now() % 1000)));
    }

    tick();

    // ── floating particles ──
    (function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 6 + 2;
        p.style.width  = size + 'px';
        p.style.height = size + 'px';
        p.style.left   = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 15 + 10) + 's';
        p.style.animationDelay    = (Math.random() * 10) + 's';
        container.appendChild(p);
      }
    })();
  </script>
</body>
</html>
